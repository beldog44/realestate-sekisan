<!--
  アットホーム(athome.co.jp)物件詳細ページの構造を模したフィクスチャ。
  parseAthome のセレクタ(h1 / [class*=price] / th|dt ラベル部分一致)に対応。
-->
<!DOCTYPE html>
<html lang="ja">
  <head><title>アットホーム 物件詳細</title></head>
  <body>
    <h1>船橋アパート一棟</h1>
    <div class="priceArea">1,980万円</div>
    <dl>
      <dt>所在地</dt><dd>千葉県船橋市本町2-3-4</dd>
      <dt>土地面積</dt><dd>80㎡</dd>
      <dt>建物面積</dt><dd>70.5㎡</dd>
    </dl>
  </body>
</html>

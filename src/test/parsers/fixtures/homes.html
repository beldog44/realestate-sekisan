<!--
  LIFULL HOME'S(homes.co.jp)物件詳細ページの構造を模したフィクスチャ。
  parseHomes のセレクタ(h1 / .priceLabel / th|dt ラベル部分一致)に対応。
-->
<!DOCTYPE html>
<html lang="ja">
  <head><title>LIFULL HOME'S 物件詳細</title></head>
  <body>
    <h1>名古屋中古マンション</h1>
    <span class="priceLabel">2,480万円</span>
    <table>
      <tbody>
        <tr><th>所在地</th><td>愛知県名古屋市中区栄3-4-5</td></tr>
        <tr><th>土地面積</th><td>65.8㎡</td></tr>
        <tr><th>建物面積</th><td>55.2㎡</td></tr>
      </tbody>
    </table>
  </body>
</html>

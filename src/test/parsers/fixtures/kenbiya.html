<!--
  健美家(kenbiya.com)物件詳細ページの構造を模したフィクスチャ。
  parseKenbiya のセレクタ(h1/.property-name / .price / th|dt|.label ラベル)に対応。
-->
<!DOCTYPE html>
<html lang="ja">
  <head><title>健美家 物件詳細</title></head>
  <body>
    <h1 class="property-name">梅田レジデンス一棟</h1>
    <div class="item-price">3,500万円</div>
    <table>
      <tbody>
        <tr><th>所在地</th><td>大阪府大阪市北区梅田1-1</td></tr>
        <tr><th>土地面積</th><td>90.12㎡</td></tr>
        <tr><th>建物面積</th><td>150.5㎡</td></tr>
        <tr><th>構造</th><td>重量鉄骨造</td></tr>
        <tr><th>築年月</th><td>2001年6月</td></tr>
        <tr><th>表面利回り</th><td>7.2%</td></tr>
        <tr><th>再建築</th><td>再建築可</td></tr>
      </tbody>
    </table>
  </body>
</html>
